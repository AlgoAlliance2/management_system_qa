[pytest]
minversion = 8.0
addopts = --verbose --capture=no
testpaths = tests
base_url = http://localhost:5173
markers =
    smoke: Critical capability tests
    auth: Authentication and authorization tests
    homepage: Homepage and landing page tests
    functional: Full functionality tests
    security: Security vulnerability tests
    usability: User experience and interface tests
    penetration: Penetration testing scenarios

